[package]
name = "gothic-reforged"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
trace = ["viewer", "bevy/trace", "bevy/debug"]
ui-demo = ["viewer", "dep:gothic-ui"]
viewer = ["dep:gothic-animation", "dep:gothic-ui", "dep:gothic-audio", "dep:gothic-runtime", "dep:gothic-nav", "dep:gothic-sim", "dep:gothic-gameplay", "dep:gothic-cook", "dep:gothic-fx", "dep:gothic-combat-souls", "dep:gothic-mods", "dep:gothic-modtool", "dep:gothic-mods-script", "dep:gothic-video", "dep:gothic-static-render", "bevy/3d_bevy_render", "bevy/bevy_winit", "bevy/multi_threaded", "bevy/bevy_log", "bevy/bevy_gizmos", "bevy/default_font"]

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor"] }
gothic-world = { path = "../../crates/world" }
gothic-environment = { path = "../../crates/environment" }
gothic-render-rules = { path = "../../crates/render-rules" }
gothic-formats = { path = "../../crates/formats" }
gothic-importer = { path = "../../crates/importer" }
gothic-physics = { path = "../../crates/physics" }
gothic-camera = { path = "../../crates/camera" }
gothic-animation = { path = "../../crates/animation", optional = true }
gothic-ui = { path = "../../crates/ui", optional = true }
gothic-audio = { path = "../../crates/audio", optional = true }
gothic-runtime = { path = "../../crates/runtime", optional = true }
gothic-nav = { path = "../../crates/nav", optional = true }
gothic-sim = { path = "../../crates/sim", optional = true }
gothic-gameplay = { path = "../../crates/gameplay", optional = true }
gothic-cook = { path = "../../crates/cook", default-features = false, optional = true }
gothic-combat-souls = { path = "../../crates/combat-souls", features = ["plugin", "pack"], optional = true }
gothic-fx = { path = "../../crates/fx", features = ["render"], optional = true }
# Opt-in integrations (`--mods`, `--video`, `--static-render`; see apps/game/src/walk/cloud).
gothic-mods = { path = "../../crates/mods", optional = true }
gothic-modtool = { path = "../modtool", optional = true }
gothic-mods-script = { path = "../../crates/mods-script", features = ["runtime"], optional = true }
# ffmpeg runs as a subprocess at runtime: nothing is linked, so no separate cargo feature.
gothic-video = { path = "../../crates/video", features = ["bevy"], optional = true }
gothic-static-render = { path = "../../crates/static-render", optional = true }
anyhow.workspace = true
serde_json.workspace = true

[lints]
workspace = true

