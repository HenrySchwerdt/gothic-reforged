[package]
name = "gothic-cook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gothic-coords = { path = "../coords" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
dirs = "6"
meshopt = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bincode = "1"
ctt-astcenc = { version = "0.6", optional = true }
texture2ddecoder = "0.1"
gothic-formats = { path = "../formats" }
gothic-importer = { path = "../importer" }
gothic-gameplay = { path = "../gameplay" }

[lints.rust]
# The only unsafe code is the memory-map call in `mmap.rs`.
unsafe_code = "deny"

[features]
default = ["astc"]
astc = ["dep:ctt-astcenc"]
