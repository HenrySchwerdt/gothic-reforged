[package]
name = "gothic-vr-archery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Physical two-handed bow: quiver, nocking, draw power, ballistic arrows that stick"

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "default-collider", "xpbd_joints", "parallel", "debug-plugin"] }
glam = { version = "0.33", features = ["serde"] }
serde.workspace = true
gothic-vr = { path = "../vr" }
gothic-vr-physics = { path = "../vr-physics" }
gothic-vr-melee = { path = "../vr-melee" }

[lints]
workspace = true
