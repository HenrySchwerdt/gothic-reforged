[package]
name = "gothic-environment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Time of day, sun/moon, sky, fog, weather state machine and surface wetness; optional Bevy plugin"

[features]
default = []
# Bevy plugin: lights, ambient, fog, sky dome and the precipitation overlay.
render = ["dep:bevy", "bevy/3d_bevy_render", "bevy/ui_bevy_render"]
# Windowed greybox demo (`cargo run -p gothic-environment --example greybox --features demo`).
demo = ["render", "bevy/bevy_winit", "bevy/x11", "bevy/multi_threaded", "bevy/default_font", "bevy/png"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
ron = "0.8"
serde_json.workspace = true
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log"], optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[[example]]
name = "timeline"

[[example]]
name = "greybox"
required-features = ["demo"]

[lints]
workspace = true
