[package]
name = "gothic-vr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VR foundation: tracked head/hands input, desktop fallback, stereo rig, comfort locomotion and full-body IK"

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log", "multi_threaded", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_camera", "bevy_window", "bevy_gizmos"] }
gothic-physics = { path = "../physics" }
gothic-runtime = { path = "../runtime" }
gothic-sim = { path = "../sim" }
glam = { version = "0.33", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
# OpenXR backend (VR-07): raw bindings, loader opened at runtime (no link-time dependency).
openxr = { version = "=0.22.0", default-features = false, features = ["loaded"], optional = true }
libc = { version = "0.2", optional = true }

[features]
default = ["desktop"]
# Desktop window, emulator and full 3D render stack. Off for the Quest (NativeActivity, no winit).
desktop = ["bevy/3d_bevy_render", "bevy/bevy_winit", "bevy/default_font", "bevy/x11"]
openxr = ["dep:openxr", "dep:libc"]

[lints.rust]
# The only unsafe code is the OpenXR FFI in `openxr.rs` (feature `openxr`).
unsafe_code = "deny"

[[example]]
name = "openxr_probe"
required-features = ["openxr"]

[[test]]
name = "openxr"
required-features = ["openxr"]
