[package]
name = "gothic-static-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Static props at scale: cluster BVH view + shadow-cascade culling, LOD ranges, GPU-driven batching in Bevy"

[features]
default = []
# Bevy plugin (registry, cluster culling, LOD entities).
bevy = ["dep:bevy", "bevy/3d_bevy_render"]
# Windowed benchmark example.
demo = ["bevy", "bevy/bevy_winit", "bevy/x11", "bevy/multi_threaded", "bevy/default_font"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log"], optional = true }

[[example]]
name = "bench"
required-features = ["demo"]

[lints]
workspace = true
