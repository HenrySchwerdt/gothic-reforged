[package]
name = "gothic-formats-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gothic-formats = { path = ".." }

# Own workspace: needs nightly (`cargo +nightly fuzz run <target>`), not part of the main build.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "pak"
path = "fuzz_targets/pak.rs"
test = false
doc = false
bench = false

