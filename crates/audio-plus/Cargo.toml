[package]
name = "gothic-audio-plus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in enhanced audio: HRTF spatialisation, occlusion/obstruction low-pass, reverb zones"

[features]
default = []
# Bevy plugin: enhanced voices as bevy_audio sources, listener/emitter tracking.
plugin = ["dep:bevy", "dep:gothic-audio", "bevy/bevy_audio"]

[dependencies]
serde.workspace = true
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log"], optional = true }
gothic-audio = { path = "../audio", optional = true }
anyhow.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
