[package]
name = "gothic-vr-physics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Boneworks-style physics hands, grabbing and weighted weapons on avian3d"

[dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "bevy_log"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "default-collider", "xpbd_joints", "parallel", "debug-plugin"] }
glam = "0.33"
serde.workspace = true
gothic-vr = { path = "../vr", default-features = false }

[lints]
workspace = true
