[workspace]
members = ["crates/portcov", "crates/gameplay", "apps/dialog-cli", "apps/questlint", "crates/formats", "crates/importer", "crates/world", "apps/inspector", "apps/game", "crates/physics", "crates/animation", "crates/audio", "crates/ui", "crates/sim", "crates/script", "crates/runtime", "crates/cook", "crates/nav", "crates/camera", "crates/fx", "crates/combat-souls", "crates/input", "crates/projectile", "crates/environment", "crates/render-rules"]
default-members = ["crates/gameplay", "apps/dialog-cli", "apps/questlint", "apps/inspector", "crates/formats", "crates/importer", "crates/world", "crates/sim", "crates/script", "crates/runtime", "crates/cook", "crates/nav", "crates/camera", "crates/fx", "crates/combat-souls", "crates/input", "crates/projectile", "crates/environment", "crates/render-rules"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bevy = { version = "=0.20.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.test]
inherits = "dev"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# Fast-iteration build for profiling and benchmarks: same optimisation level, no LTO, parallel
# codegen, line tables for symbolised profiles. `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
lto = "off"
codegen-units = 16
panic = "unwind"
debug = "line-tables-only"

